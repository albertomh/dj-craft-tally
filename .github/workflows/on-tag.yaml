# On Tag pipeline
# Runs when a semver tag is pushed up to GitHub.

name: on-tag

on:
  push:
    # run this workflow only if the tag matches the format 'M.m.p' (semver)
    tags:
      - '*.*.*'

permissions:
  contents: read

jobs:
  checks:
    uses: $/.github/workflows/_checks.yaml

  publish-pypi:
    needs: checks
    runs-on: ubuntu-26.04
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/publish
