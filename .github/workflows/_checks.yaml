# Run checks and test suite.
#
# Usage:
# ```
# jobs:
#   checks:
#     uses: $/.github/workflows/_checks.yaml
# ```
name: Checks

on:
  workflow_call:

jobs:
  translations:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Check gettext catalogs
        run: msgfmt --check --check-format src/dj_craft_tally/locale/*/LC_MESSAGES/django.po

  lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  pre_commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prek

  generate_matrix:
    runs-on: ubuntu-26.04
    outputs:
      session: ${{ steps.set-matrix.outputs.session }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.5"
      - uses: wntrblm/nox@2026.10.20
      - id: set-matrix
        run: echo "session=$(uvx nox --json -l -s test | jq -c '[.[].session]')" >> "$GITHUB_OUTPUT"

  test:
    needs:
      - pre_commit
      - generate_matrix
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs.generate_matrix.outputs.session) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: wntrblm/nox@2026.10.20
      - run: nox -s "$NOX_SESSION"
        env:
          NOX_SESSION: ${{ matrix.session }}
