# Run checks and test suite.
#
# Usage:
# ```
# jobs:
#   checks:
#     uses: $/.github/workflows/_checks.yaml
# ```
name: Checks

on:
  workflow_call:

jobs:
  gha_lockfile:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  pre_commit:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/prek

  translations:
    needs:
      - pre_commit
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Check gettext catalogs
        run: |
          for catalog in src/dj_craft_tally/locale/*/LC_MESSAGES/django.po; do
            compiled="${catalog%.po}.mo"
            msgfmt --check --check-format -o /tmp/django.mo "$catalog"
            cmp "$compiled" /tmp/django.mo
          done
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.5"
      - name: Check distribution catalogs
        run: |
          uv build --out-dir dist/translation-check
          uv run python .github/scripts/check-translation-distributions.py

  generate_nox_py_versions:
    runs-on: ubuntu-26.04
    outputs:
      session: ${{ steps.set-matrix.outputs.session }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.5"
      - uses: wntrblm/nox@2026.10.20
      - id: set-matrix
        run: echo "session=$(uvx nox --json -l -s test | jq -c '[.[].session]')" >> "$GITHUB_OUTPUT"

  test:
    needs:
      - pre_commit
      - generate_nox_py_versions
    strategy:
      fail-fast: false
      matrix:
        session: ${{ fromJSON(needs. generate_nox_py_versions.outputs.session) }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: "0.12.5"
          enable-cache: true
      - uses: wntrblm/nox@2026.10.20
      - run: nox -s "$NOX_SESSION"
        env:
          NOX_SESSION: ${{ matrix.session }}

  # Configure this check as the single required status check in the `automerge-checks` ruleset.
  required:
    if: ${{ always() }}
    needs:
      - pre_commit
      - gha_lockfile
      - translations
      - generate_nox_py_versions
      - test
    runs-on: ubuntu-26.04
    steps:
      - name: Fail when a check did not pass
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
